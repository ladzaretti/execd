name: golang-ci

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  # renovate: datasource=golang-version depName=go versioning=go-mod-directive
  GO_VERSION: 1.26.7

jobs:
  lint-and-test:
    name: lint & test
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/lint-and-test
        with:
          go-version: ${{env.GO_VERSION}}
